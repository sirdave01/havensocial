name: Publish scheduled HavenSocial posts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Publish due posts
        env:
          CRON_URL: ${{ secrets.HAVENSOCIAL_CRON_URL }}
          CRON_SECRET: ${{ secrets.HAVENSOCIAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing HAVENSOCIAL_CRON_URL or HAVENSOCIAL_CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request GET "$CRON_URL" \
            --header "Authorization: Bearer $CRON_SECRET"
